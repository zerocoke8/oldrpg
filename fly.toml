# fly.io 배포 설정.
#
# ★ 이 앱은 '항상 켜져 있는 프로세스 하나 + 디스크 하나' 다. Dockerfile 머리
#   주석에 그 논거가 있다 — 권위 상태가 메모리에 있다(세션 레지스트리, 0.5초
#   전투 틱, 리스폰 대기, 유예 타이머, 승급 큐). 그래서 아래 세 줄이 이
#   파일에서 가장 중요하다:
#
#     auto_stop_machines   머신이 잠들면 '지금 싸우던 것' 이 통째로 사라진다.
#                          DB 는 남지만 전투는 안 남는다. 비용 설정이 아니라
#                          게임성 결정이라, 끄는 것이 기본이다.
#     auto_start_machines  깨우는 경로도 두지 않는다 (잠들지 않으므로).
#     min_machines_running 1. 0 이면 위와 모순이다.
#
#   그리고 `fly scale count` 를 1 보다 크게 두지 말 것. 인스턴스 둘은 세계 둘이다.
#
# ★ 세 값이 Dockerfile 과 묶여 있고 test/deploy.ts ⓪-f 가 그것을 대조한다:
#     internal_port          == ENV MUD_PORT == EXPOSE   (8787)
#     mounts.destination     == dirname(ENV MUD_DB)      (/data)
#     checks.path            == static.ts 가 처리하는 경로 (/healthz)
#
# ★ 아직 실기로 배포해 본 적이 없다. 아래 값 중 사람이 정해야 하는 것:
#   app 이름 · primary_region · 볼륨 이름과 크기 · VM 크기.

app = 'oldtextrpg'
primary_region = 'nrt'

[build]

[env]
  # MUD_PORT / MUD_DB 는 Dockerfile 의 ENV 가 이미 정한다. 여기서 다시 쓰면
  # 두 곳이 어긋날 수 있어 쓰지 않는다.
  #
  # ★ 프록시 뒤에서는 이것을 켜야 IP 예산이 사람 단위로 센다. 기본이 0 이라
  #   그대로 두면 접속자 전원이 한 IP 버킷이 된다.
  #
  # ★ 2 는 실측값이다. 2026-09-07 첫 배포에서 서버가 스스로 찍었다:
  #     [mud] IP 판정 (첫 연결 한 번만): MUD_TRUST_PROXY=1 · 홉 2개
  #           [14.32.15.80 | 66.241.124.50] · socket=::ffff:172.16.31.194
  #           -> 쓰는 값 66.241.124.50
  #   접속한 사람의 공인 IP 는 14.32.15.80 이었는데 1 은 66.241.124.50 —
  #   fly-proxy 의 주소 — 을 집었다. fly 는 XFF 에 두 홉을 쌓는다(에지가 접속자
  #   주소를, 내부 홉이 에지 주소를 덧붙인다). 오른쪽에서 2번째가 사람이다.
  #   1 이었다면 아무 오류 없이 접속자 전원이 66.241.124.50 한 버킷에 들어가
  #   서로를 flooding 으로 밀어냈을 것이다 — 누가 쏟아붓기 전까지 안 보인 채로.
  #   ★ fly 가 홉 수를 바꾸면 이 값도 틀린다. 확인하는 법은 그때도 같다:
  #     재배포 뒤 첫 접속에서 fly logs --no-tail | grep "IP 판정".
  MUD_TRUST_PROXY = '2'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[mounts]
  source = 'oldrpg_data'
  destination = '/data'
  initial_size = '1GB'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
